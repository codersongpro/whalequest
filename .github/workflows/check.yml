name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  phase-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: whalequest-phase-1
          path: dist/
